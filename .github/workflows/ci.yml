name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (JVM, Android, iOS Framework)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Spotless Code Format Check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run Shared Module Tests
        run: ./gradlew :shared:allTests --stacktrace

      - name: Assemble Android APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Build iOS Framework (XCFramework / Simulator Link)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace